name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      versionOverride:
        description: 'Override version (leave empty to use VersionPrefix + auto-incremented patch)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-test-results
          path: TestResults/*.trx

      - name: Determine version
        id: version
        run: |
          VERSION_PREFIX=$(grep -oP '<VersionPrefix>\K[^<]+' Directory.Build.props)

          if [ -n "${{ github.event.inputs.versionOverride }}" ]; then
            VERSION="${{ github.event.inputs.versionOverride }}"
          else
            VERSION="${VERSION_PREFIX}.${{ github.run_number }}"
          fi

          echo "Using version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Pack YamlFrontMatter
        run: >
          dotnet pack src/YamlFrontMatter/YamlFrontMatter.fsproj
          -c Release
          /p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - name: Pack YamlFrontMatter.TypeProvider
        run: >
          dotnet pack src/YamlFrontMatter.TypeProvider/YamlFrontMatter.TypeProvider.fsproj
          -c Release
          /p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
