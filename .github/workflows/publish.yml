name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      versionOverride:
        description: 'Override version (leave empty to use VersionPrefix + auto-incremented patch)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: publish-test-results
          path: TestResults/*.trx

      - name: Determine version
        id: version
        run: |
          VERSION_PREFIX=$(grep -oP '<VersionPrefix>\K[^<]+' Directory.Build.props)

          if [ -n "${{ github.event.inputs.versionOverride }}" ]; then
            VERSION="${{ github.event.inputs.versionOverride }}"
          else
            VERSION="${VERSION_PREFIX}.${{ github.run_number }}"
          fi

          echo "Using version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Pack the whole solution in one shot. Solving two distinct bugs at once:
      #
      # 1. The previous per-fsproj pack approach intermittently dropped the
      #    design-time DLL from the YamlFrontMatter.TypeProvider package on CI
      #    runners — 0.9.1 / 0.9.2 / 0.9.3 / 0.9.4 all shipped a 27 KB nupkg
      #    with only the runtime stub, despite the build itself being correct.
      #    Solution-level pack runs the SDK's CollectFSharpDesignTimeTools target
      #    in the same MSBuild invocation that produces the package, so the
      #    design-time DLL reliably ends up in typeproviders/fsharp41/<tfm>/.
      #
      # 2. A previous "cleanup" commit accidentally dropped the explicit
      #    `Pack dotnet-yamlfm` step, so the CLI tool stopped being published
      #    after 0.9.2. With solution-level pack any project carrying
      #    IsPackable=true (Core + TypeProvider runtime + dotnet-yamlfm) is
      #    packed automatically — no per-project step to forget.
      #
      # IsPackable=false on the DesignTime project + Tests keeps those out of
      # the artifacts/ folder.
      - name: Pack solution
        run: >
          dotnet pack YamlFrontMatter.sln
          -c Release
          /p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
